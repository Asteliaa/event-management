# Render Blueprint: backend (Node.js) – https://render.com/docs/blueprint-spec
# База данных – управляемая PostgreSQL, строка подключения задается в DATABASE_URL.
# Провайдер развертывания курсовой еще не выбран окончательно: файл описывает только backend
services:
  - type: web
    name: eventhub-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    # новые миграции применяются перед запуском сервера
    startCommand: node scripts/migrate.js up && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false        # адрес фронтенда на Netlify, например https://eventhub.netlify.app

# Запуск всего приложения: docker compose up --build, демо-данные: docker compose exec backend npm run seed
# Переменные ${...} берутся из файла .env рядом с этим файлом (см. .env.example).
# Пароли и секреты в репозитории не хранятся: без них (${VAR:?...}) Compose не запустится
name: event-management

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-eventhub}
    volumes:
      - pg-data:/var/lib/postgresql/data   # данные БД сохраняются при пересоздании контейнера
    # порт наружу не публикуется: база доступна только backend во внутренней сети db.
    # Консоль: docker compose exec postgres psql -U eventhub eventhub
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: .
    image: event-management-backend
    restart: unless-stopped
    init: true                       # tini в роли PID 1: корректная обработка SIGTERM
    # перед стартом применяются новые миграции схемы (уже примененные пропускаются)
    command: ["sh", "-c", "node scripts/migrate.js up && exec node server.js"]
    environment:
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-eventhub}:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/${POSTGRES_DB:-eventhub}
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
      CLIENT_URL: http://localhost
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.eventhub.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?задайте SEED_ADMIN_PASSWORD в .env}
      # адрес клиента для ссылок в письмах (доверенная конфигурация, не заголовок Host)
      APP_URL: ${APP_URL:-http://localhost}
      # SMTP для писем восстановления пароля. Пусто – письма не отправляются.
      # Для разработки: SMTP_HOST=mailpit и запуск с профилем mail (см. сервис mailpit)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-EventHub <no-reply@eventhub.local>}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy   # backend стартует, когда PostgreSQL принимает подключения
    networks:
      - db
      - web

  frontend:
    build: ./client
    image: event-management-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web

  # Только для разработки: Mailpit принимает письма по SMTP (порт 1025 во внутренней сети web)
  # и показывает их в веб-интерфейсе http://localhost:8025. Наружу письма не отправляет (пересылка не настроена).
  # Запуск: SMTP_HOST=mailpit docker compose --profile mail up -d
  mailpit:
    image: axllent/mailpit:v1.27.1
    restart: unless-stopped
    profiles: [mail]
    ports:
      - "127.0.0.1:8025:8025"        # веб-интерфейс только с этого компьютера
    networks:
      - web

networks:
  web:                               # внешняя сеть: nginx и backend
  db:
    internal: true                   # внутренняя сеть без выхода наружу: PostgreSQL и backend

volumes:
  pg-data:

# Непрерывная интеграция: тесты сервера и сборка клиента при каждом push и pull request
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Сервер (Jest)
    runs-on: ubuntu-latest
    # отдельная временная PostgreSQL только для тестов; пароль тестовый, не секрет
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventhub
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: eventhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventhub -d eventhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://eventhub:ci_test_password@localhost:5432/eventhub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  frontend:
    name: Клиент (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /api/v1

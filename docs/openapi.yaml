openapi: 3.0.3
info:
  title: EventHub API
  version: 2.2.0
  description: |
    REST API веб-приложения для организации конференций, вебинаров и встреч
    с регистрацией участников и напоминаниями (курсовая работа, тема №11).

    Все ответы с ошибкой имеют единый формат `{ "error": { "status", "code", "message", "details" } }`.
    Списки с пагинацией возвращают `{ "data": [...], "meta": { "page", "limit", "total", "pages" } }`.

    Роли: участник (user), организатор (organizer – управляет своими мероприятиями), администратор (admin).
    Ссылка подключения онлайн-мероприятия (`location.url`) возвращается только активному участнику
    опубликованного мероприятия, организатору-владельцу и администратору.
    JWT содержит версию токенов (`tv`): после блокировки, деактивации, удаления, смены роли или пароля
    ранее выданные токены отклоняются с кодом 401.
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Регистрация, вход и профиль текущего пользователя
  - name: Events
    description: Каталог мероприятий
  - name: Registrations
    description: Регистрации на мероприятия
  - name: Organizer
    description: Управление мероприятиями (организатор-владелец и администратор)
  - name: Reminders
    description: Напоминания о мероприятиях
  - name: Notifications
    description: История уведомлений
  - name: Categories
    description: Категории мероприятий
  - name: Admin
    description: Администрирование
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      description: Идентификатор записи (bigint) строкой
      schema: { type: string, pattern: '^[1-9][0-9]{0,18}$', example: '42' }
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoContent:
      description: Успешно, без тела ответа
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            status: { type: integer, example: 422 }
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Ошибка валидации данных }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: body.email }
                  message: { type: string, example: Некорректный email }
    Meta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 12 }
        total: { type: integer, example: 30 }
        pages: { type: integer, example: 3 }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Анна Петрова }
        email: { type: string, nullable: true, example: anna@demo.eventhub.local, description: пустой у удаленного (обезличенного) аккаунта }
        role: { type: string, enum: [user, organizer, admin] }
        city: { type: string, example: Минск }
        blocked: { type: boolean }
        blockedAt: { type: string, format: date-time }
        status: { type: string, enum: [active, deactivated, deleted] }
        deactivatedAt: { type: string, format: date-time }
        deactivatedBy: { type: string, enum: [user, admin] }
        deletedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    UserPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/User' } }
        meta: { $ref: '#/components/schemas/Meta' }
    AuthResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string, example: eyJhbGciOiJIUzI1NiIs... }
    PasswordConfirm:
      type: object
      required: [password]
      properties:
        password: { type: string, description: текущий пароль для подтверждения }
    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: IT и разработка }
        slug: { type: string, example: it-i-razrabotka }
        color: { type: string, example: '#6366f1' }
        description: { type: string }
        eventsCount: { type: integer, example: 4 }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Дизайн }
        color: { type: string, example: '#ec4899' }
        description: { type: string }
    Location:
      type: object
      properties:
        city: { type: string, example: Минск }
        venue: { type: string, example: Конгресс-холл }
        online: { type: boolean, example: false }
        url: { type: string, example: https://meet.example.com/abc, description: только для участников и организатора }
    Event:
      type: object
      properties:
        id: { type: string }
        title: { type: string, example: Конференция разработчиков 2026 }
        description: { type: string }
        type: { type: string, enum: [conference, webinar, meeting] }
        status: { type: string, enum: [draft, published, cancelled] }
        timezone: { type: string, example: Europe/Minsk, description: IANA-пояс мероприятия }
        category: { $ref: '#/components/schemas/Category' }
        organizer: { type: object, properties: { id: { type: string }, name: { type: string } } }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        registrationOpen: { type: boolean }
        registrationDeadline: { type: string, format: date-time, nullable: true }
        registrationAvailable: { type: boolean, description: можно ли зарегистрироваться сейчас }
        scheduleVersion: { type: integer, example: 1, description: увеличивается при каждом переносе }
        publishedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        cancelReason: { type: string }
        phase: { type: string, enum: [upcoming, live, finished] }
        coverUrl: { type: string }
        capacity: { type: integer, nullable: true, example: 300 }
        seatsTaken: { type: integer, example: 120 }
        seatsLeft: { type: integer, nullable: true, example: 180 }
        isPast: { type: boolean }
        location: { $ref: '#/components/schemas/Location' }
        tags: { type: array, items: { type: string }, example: [it, backend] }
    EventDetails:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: Поля для авторизованного пользователя
          properties:
            canManage: { type: boolean, description: владелец или администратор }
            myRegistration: { $ref: '#/components/schemas/Registration' }
            myReminders: { type: array, items: { $ref: '#/components/schemas/Reminder' } }
            isFavorite: { type: boolean }
    EventInput:
      type: object
      description: Черновик может быть неполным; для публикации нужны даты, часовой пояс и место (город или ссылка)
      required: [title, type, timezone]
      properties:
        title: { type: string, example: Вебинар по React 19 }
        description: { type: string }
        type: { type: string, enum: [conference, webinar, meeting] }
        status: { type: string, enum: [draft, published], description: только при создании; по умолчанию draft }
        timezone: { type: string, example: Europe/Minsk }
        category: { type: string, nullable: true }
        organizer: { type: string, description: передача владельца – только администратор }
        startsAt: { type: string, format: date-time, nullable: true, example: '2026-12-15T15:00:00.000Z' }
        endsAt: { type: string, format: date-time, nullable: true }
        registrationOpen: { type: boolean }
        registrationDeadline: { type: string, format: date-time, nullable: true }
        coverUrl: { type: string }
        capacity: { type: integer, nullable: true, example: 100 }
        location: { $ref: '#/components/schemas/Location' }
        tags: { type: array, items: { type: string } }
    EventPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Event' } }
        meta: { $ref: '#/components/schemas/Meta' }
    Registration:
      type: object
      properties:
        id: { type: string }
        event: { oneOf: [{ type: string }, { $ref: '#/components/schemas/Event' }] }
        user: { oneOf: [{ type: string }, { $ref: '#/components/schemas/User' }] }
        status: { type: string, enum: [registered, cancelled], description: посещение хранится отдельно (attended) }
        attended: { type: boolean, description: отметка посещения (с момента начала; не меняет счетчик мест) }
        attendanceMarkedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        cancelledBy: { type: string, enum: [user, organizer, admin, system] }
        cancelReason: { type: string, description: причина отмены организатором или администратором }
        comment: { type: string }
        legacyTickets: { type: integer, description: число билетов до перехода на «одна регистрация – одно место» }
        createdAt: { type: string, format: date-time }
    Reminder:
      type: object
      properties:
        id: { type: string }
        event: { oneOf: [{ type: string }, { $ref: '#/components/schemas/Event' }] }
        registration: { type: string }
        offsetMinutes: { type: integer, example: 1440 }
        remindAt: { type: string, format: date-time }
        kind: { type: string, enum: [auto, custom] }
        status: { type: string, enum: [pending, sent, cancelled, skipped] }
        cancelReason: { type: string, example: registration_cancelled }
        scheduleVersion: { type: integer }
        sentAt: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [reminder, event_rescheduled, event_location_changed, event_cancelled, registration_cancelled] }
        event: { oneOf: [{ type: string }, { $ref: '#/components/schemas/Event' }] }
        registration: { type: string }
        reminder: { type: string }
        payload: { type: object, description: подробности без личных данных и без ссылки подключения }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties: { unread: { type: integer } }
    EventStats:
      type: object
      properties:
        event: { type: object, properties: { id: { type: string }, title: { type: string }, capacity: { type: integer, nullable: true }, seatsTaken: { type: integer } } }
        registrations: { type: object, properties: { active: { type: integer }, attended: { type: integer }, cancelled: { type: integer }, users: { type: integer } } }
        fillRate: { type: integer, nullable: true }
        favorites: { type: integer }
        timeline: { type: array, items: { type: object, properties: { date: { type: string }, count: { type: integer } } } }
    Stats:
      type: object
      properties:
        totals:
          type: object
          properties:
            events: { type: integer }
            upcoming: { type: integer }
            users: { type: integer, description: без удаленных }
            registrations: { type: integer }
            cancelledRegistrations: { type: integer }
            remindersSent: { type: integer }
        byType: { type: array, items: { type: object } }
        byCategory: { type: array, items: { type: object } }
        topEvents: { type: array, items: { $ref: '#/components/schemas/Event' } }
        timeline: { type: array, items: { type: object, properties: { date: { type: string }, count: { type: integer } } } }
paths:
  /health:
    get:
      summary: Состояние сервера и БД
      tags: [Admin]
      responses:
        '200': { description: Сервер и PostgreSQL работают }
        '503': { description: Нет соединения с PostgreSQL }
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Анна Петрова }
                email: { type: string, example: anna@example.com }
                password: { type: string, example: secret123, description: 'не короче 8 символов, буква и цифра' }
      responses:
        '201': { description: Создан, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '409': { description: Email занят (EMAIL_TAKEN) }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Вход, выдача JWT (вход отменяет деактивацию, выполненную самим пользователем)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: admin@demo.eventhub.local }
                password: { type: string, example: admin12345 }
      responses:
        '200':
          description: 'OK; reactivated = true – вход восстановил аккаунт, деактивированный самим пользователем'
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AuthResult' }
                  - { type: object, properties: { reactivated: { type: boolean } } }
        '401': { description: Неверный email или пароль (в том числе удаленный аккаунт) }
        '403': { description: Аккаунт заблокирован или деактивирован администратором (ACCOUNT_DEACTIVATED) }
        '429': { $ref: '#/components/responses/Error' }
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Запросить письмо со ссылкой восстановления пароля
      description: |
        Ответ 202 одинаков для существующего и неизвестного адреса; письмо отправляется в фоне, сбой SMTP ответ не меняет.
        Письмо получает только активный или деактивированный самим пользователем аккаунт (не заблокированный и не удаленный).
        Ссылка: APP_URL/reset-password#token=… (токен 256 бит, срок 30 минут, одноразовый; новый запрос отзывает прежний).
        Ограничения: 10 запросов с IP за 15 минут, 3 письма на адрес за час.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '202': { description: Принято (одинаковый ответ), content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        '422': { $ref: '#/components/responses/Error' }
        '429': { description: Превышено ограничение частоты (TOO_MANY_REQUESTS) }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Задать новый пароль по токену из письма
      description: |
        Погашение токена и смена пароля выполняются атомарно (из параллельных запросов с одним токеном успешен один).
        Все сеансы завершаются (token_version + 1), отправляется письмо «пароль изменен» без пароля. Вход не выполняется.
        Деактивированный самим пользователем аккаунт остается деактивированным до следующего входа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, passwordConfirm]
              properties:
                token: { type: string, description: base64url, 43 символа }
                password: { type: string, minLength: 8, maxLength: 72 }
                passwordConfirm: { type: string }
      responses:
        '200': { description: Пароль изменен, content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        '400': { description: 'Токен неизвестен, просрочен, использован или отозван, либо аккаунту восстановление недоступно (INVALID_RESET_TOKEN)' }
        '422': { description: Ошибка валидации (в том числе пароли не совпадают) }
        '429': { description: Превышено ограничение частоты (TOO_MANY_REQUESTS) }
  /auth/me:
    get:
      tags: [Auth]
      summary: Профиль текущего пользователя
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Auth]
      summary: Изменение профиля
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                city: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Auth]
      summary: Удалить свой аккаунт (необратимое обезличивание, см. README)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordConfirm' } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { description: Неверный пароль }
        '409': { description: Есть будущие опубликованные мероприятия (ORGANIZER_HAS_FUTURE_EVENTS) }
  /auth/me/deactivate:
    post:
      tags: [Auth]
      summary: Деактивировать свой аккаунт (обратимо входом с паролем)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordConfirm' } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { description: Неверный пароль }
  /auth/me/password:
    put:
      tags: [Auth]
      summary: Смена пароля; другие сеансы завершаются, ответ – новый токен
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /auth/me/registrations:
    get:
      tags: [Auth, Registrations]
      summary: Мои регистрации (ссылка подключения – только у активных регистраций на опубликованные мероприятия)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: when, in: query, schema: { type: string, enum: [all, upcoming, past], default: all } }
        - { name: status, in: query, schema: { type: string, enum: [active, cancelled, all], default: active } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Registration' } } } } }
  /auth/me/favorites:
    get:
      tags: [Auth]
      summary: Избранные мероприятия
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Event' } } } } }
  /auth/me/favorites/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [Auth]
      summary: Добавить мероприятие в избранное
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Auth]
      summary: Убрать из избранного
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /events:
    get:
      tags: [Events]
      summary: Каталог опубликованных мероприятий с фильтрами, сортировкой и пагинацией
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Поиск по названию, описанию и тегам }
        - { name: type, in: query, schema: { type: string, enum: [conference, webinar, meeting] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: online, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: when, in: query, schema: { type: string, enum: [upcoming, past, all], default: upcoming } }
        - { name: sort, in: query, schema: { type: string, enum: [date, -date, popular, new], default: date } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 12, maximum: 100 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EventPage' } } } }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Organizer]
      summary: Создать мероприятие (организатор, администратор); по умолчанию черновик
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventInput' } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { description: Ошибка валидации или не заполнены поля, обязательные для публикации }
  /events/managed:
    get:
      tags: [Organizer]
      summary: Мои мероприятия со счетчиками регистраций (администратор с all=true – все)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: all, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, cancelled] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EventPage' } } } }
        '403': { $ref: '#/components/responses/Error' }
  /events/cities:
    get:
      tags: [Events]
      summary: Города, в которых проходят опубликованные мероприятия
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: string } } } } }
  /events/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Events]
      summary: Карточка мероприятия (черновик – только владельцу и администратору)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EventDetails' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Organizer]
      summary: Изменить мероприятие; смена дат – изменение расписания (schedule_version + 1, напоминания пересчитываются, участники уведомляются)
      description: |
        После начала опубликованного мероприятия часть полей зафиксирована (поля с прежним значением изменением не считаются):
        - идет – нельзя менять начало, часовой пояс, формат (online), вместимость, регистрацию (409 EVENT_STARTED);
          окончание можно только продлить (иначе 422), место и ссылку можно исправить (уведомление event_location_changed);
        - завершено – можно изменить только описание (и владельца – администратор), иначе 409 EVENT_FINISHED.
        Поле organizer (передача мероприятия) меняет только администратор; новый владелец – организатор или администратор.
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/EventInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'Мероприятие отменено (EVENT_CANCELLED), идет (EVENT_STARTED) или завершено (EVENT_FINISHED) – details содержит запрещенные поля; вместимость меньше числа участников (CAPACITY_TOO_SMALL)' }
        '422': { description: Ошибка валидации (в том числе сокращение окончания идущего мероприятия) }
    delete:
      tags: [Organizer]
      summary: Удалить черновик (опубликованные отменяются, а не удаляются)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Мероприятие не черновик (EVENT_NOT_DRAFT) }
  /events/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Organizer]
      summary: Опубликовать черновик (в том числе повторно – полная проверка)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { description: 'Не заполнены поля публикации, начало не в будущем, срок регистрации истек или позже начала' }
  /events/{id}/unpublish:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Organizer]
      summary: Вернуть в черновик – исправление ошибочной публикации (до начала и только если регистраций не было никогда)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '409': { description: 'Регистрации были, в том числе отмененные (EVENT_HAS_REGISTRATIONS), мероприятие началось (EVENT_STARTED) или не опубликовано (EVENT_NOT_PUBLISHED)' }
  /events/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Organizer]
      summary: Отменить мероприятие (идущее – только с причиной); регистрации и посещение сохраняются, напоминания отменяются, участники уведомляются, чат – только чтение
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '409': { description: 'Уже отменено (EVENT_CANCELLED), черновик (EVENT_NOT_PUBLISHED), завершено (EVENT_FINISHED)' }
        '422': { description: Идущее мероприятие без причины }
  /events/{id}/stats:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Organizer]
      summary: Статистика мероприятия
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EventStats' } } } }
        '403': { $ref: '#/components/responses/Error' }
  /events/{id}/similar:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Events]
      summary: Похожие опубликованные мероприятия
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Event' } } } } }
  /events/{id}/calendar.ics:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Events]
      summary: Файл iCalendar (без ссылки подключения)
      responses:
        '200': { description: Файл .ics, content: { text/calendar: { schema: { type: string } } } }
        '409': { description: Дата не назначена (EVENT_NO_DATE) }
  /events/{id}/registrations:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Registrations]
      summary: Зарегистрироваться (одно место; создается автоматическое напоминание)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string, maxLength: 300 }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Registration' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'ALREADY_REGISTERED, NO_SEATS, EVENT_PAST, EVENT_CANCELLED, REGISTRATION_CLOSED, REGISTRATION_DEADLINE_PASSED; черновик – 404' }
    get:
      tags: [Organizer]
      summary: Участники мероприятия с email (владелец, администратор); format=csv – выгрузка
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { name: status, in: query, schema: { type: string, enum: [all, active, attended, registered, cancelled], default: all }, description: attended – активные с отметкой посещения }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Registration' } } }, text/csv: {} } }
        '403': { $ref: '#/components/responses/Error' }
  /registrations/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [Registrations]
      summary: Комментарий (участник) или отметка посещения (владелец мероприятия, администратор)
      description: Посещение отмечается и исправляется с момента начала, только у активной регистрации и не у отмененного мероприятия; счетчик мест не меняется. Поле status не принимается (отмена – DELETE).
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                attended: { type: boolean }
                comment: { type: string, maxLength: 300 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Registration' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: 'Регистрация отменена (REGISTRATION_CANCELLED), мероприятие отменено (EVENT_CANCELLED) или еще не началось (EVENT_NOT_STARTED)' }
    delete:
      tags: [Registrations]
      summary: Отменить участие до начала (место освобождается, напоминания отменяются, доступ к чату закрывается)
      description: Участник отменяет свою регистрацию без причины. Организатор мероприятия и администратор указывают причину – участник получает уведомление registration_cancelled с причиной. Повторная отмена ничего не меняет (200).
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string, minLength: 3, maxLength: 500 } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Registration' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'Мероприятие началось (EVENT_STARTED) или отменено (EVENT_CANCELLED)' }
        '422': { description: Организатор или администратор не указал причину }
  /reminders:
    get:
      tags: [Reminders]
      summary: Мои напоминания
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, sent, cancelled, skipped] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Reminder' } } } } }
    post:
      tags: [Reminders]
      summary: Создать напоминание (нужна активная регистрация)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, offsetMinutes]
              properties:
                event: { type: string }
                offsetMinutes: { type: integer, example: 60, description: 'за сколько минут до начала (5 мин – 30 дней)' }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Reminder' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { description: 'REGISTRATION_REQUIRED, REMINDER_EXISTS, EVENT_CANCELLED' }
  /reminders/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [Reminders]
      summary: Изменить интервал
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { offsetMinutes: { type: integer } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Reminder' } } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Reminders]
      summary: Удалить напоминание
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /notifications:
    get:
      tags: [Notifications]
      summary: История уведомлений (новые сверху); meta.unread – число непрочитанных
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } }
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Число непрочитанных
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { unread: { type: integer } } } } } }
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Отметить все прочитанными
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { updated: { type: integer } } } } } }
  /notifications/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [Notifications]
      summary: Отметить прочитанным или непрочитанным
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [read], properties: { read: { type: boolean } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /categories:
    get:
      tags: [Categories]
      summary: Категории с числом предстоящих мероприятий
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } } }
    post:
      tags: [Categories]
      summary: Создать категорию (администратор)
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /categories/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [Categories]
      summary: Изменить категорию (администратор)
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
    delete:
      tags: [Categories]
      summary: Удалить категорию (мероприятия остаются без категории)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /admin/stats:
    get:
      tags: [Admin]
      summary: Статистика для панели администратора
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Stats' } } } }
  /admin/users:
    get:
      tags: [Admin]
      summary: Пользователи (удаленные – только с status=deleted)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string, enum: [user, organizer, admin] } }
        - { name: status, in: query, schema: { type: string, enum: [active, deactivated, deleted] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
  /admin/users/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [Admin]
      summary: Изменить роль или заблокировать (себя – нельзя); токены и соединения пользователя завершаются
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [user, organizer, admin] }
                blocked: { type: boolean }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { description: 'Роль user нельзя назначить, пока есть опубликованные незавершенные мероприятия, включая идущие (ORGANIZER_HAS_ACTIVE_EVENTS): сначала передача или отмена' }
    delete:
      tags: [Admin]
      summary: Удалить пользователя (необратимое обезличивание, история сохраняется)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { description: Нельзя удалить себя }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Есть будущие опубликованные мероприятия (ORGANIZER_HAS_FUTURE_EVENTS) }
  /admin/users/{id}/deactivate:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Admin]
      summary: Деактивировать (вернуть может только администратор)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { description: Нельзя деактивировать себя }
  /admin/users/{id}/reactivate:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Admin]
      summary: Вернуть деактивированный аккаунт
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
